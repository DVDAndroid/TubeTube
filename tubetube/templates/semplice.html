<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeTube</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"
          integrity="sha512-luMnTJZ7oEchNDZAtQhgjomP1eZefnl82ruTH/3Oj/Yu5qYtwL7+dVRccACS/Snp1lFXq188XFipHKYE75IaQQ=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='logo.png') }}">
</head>

<body class="d-flex flex-column min-vh-100">
<div class="container mt-3" style="max-width: 50% !important; margin-top: 15% !important;">
  <header class="mb-3">
    <h1 class="text-center">Scarica Youtube</h1>
  </header>

  <section class="mb-4">
    <div class="input-group mb-3">
      <input id="download-url" type="text" class="form-control" placeholder="Incolla link Youtube"
             aria-label="Download URL" aria-describedby="download-url">
      <div class="d-flex align-items-center pe-0">
        <div class="form-check me-3">
          <input class="form-check-input" type="radio" name="mediaType" id="videoRadio" value="video" checked>
          <label class="form-check-label" for="videoRadio">
            Video
          </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="mediaType" id="audioRadio" value="audio">
          <label class="form-check-label" for="audioRadio">
            Audio
          </label>
        </div>
      </div>
      <button class="btn btn-primary" type="button" id="download-button">
                    <span id="spinner-border" class="spinner-border spinner-border-sm ms-2" role="status"
                          aria-hidden="true" style="display: none;"></span>
        Scarica
      </button>
    </div>
    <div id="downloadSection"></div>
  </section>

  <!-- Activity Table -->
  <section class="activity-table-section">
    <table class="activity-table table table-striped table-hover fixed-layout">
      <thead class="sticky-top top-0">
      <tr>
        <th scope="col" class="id-column">#</th>
        <th scope="col" class="title-column">Nome</th>
        <th scope="col" class="status-column">Stato</th>
        <th scope="col" class="progress-column">Progresso</th>
      </tr>
      </thead>
      <tbody id="activity-table-body">
      </tbody>
    </table>
  </section>

  <!-- Row Template -->
  <template id="row-template">
    <tr>
      <td class="id"></td>
      <td class="title text-wrap"></td>
      <td class="status text-wrap"></td>
      <td class="download-progress text-wrap"></td>
    </tr>
  </template>
</div>

<!-- Toast Container -->
<div aria-live="polite" aria-atomic="true" class="position-relative">
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <!-- Toast -->
    <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
      <div class="toast-header">
        <strong class="me-auto" id="toast-title">Toast</strong>
        <small id="toast-time">Now</small>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body" id="toast-message">
        Message.
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js_general_script_semplice.js') }}"></script>
<script src="{{ url_for('static', filename='js_table_script_semplice.js') }}"></script>
</body>

</html>
